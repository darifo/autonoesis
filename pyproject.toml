[project]
name = "autonoesis-workspace"
version = "0.1.0"
description = "Enterprise Governed Self-Evolving Agent Operating System"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pip-audit>=2.9",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "types-jsonschema>=4.25",
  "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/contracts",
  "packages/domain",
  "packages/application",
  "packages/runtime-kernel",
  "packages/adapters",
  "packages/capability",
  "packages/intelligence",
  "packages/governance",
  "packages/environment",
  "packages/memory",
  "packages/improvement",
  "packages/evaluation",
  "packages/gateways",
  "packages/context",
  "packages/evolution",
  "packages/testkit",
  "examples/field-service",
  "packages/py-sdk",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
enable_incomplete_feature = ["NewGenericSyntax"]
mypy_path = [
  "apps/api/src",
  "apps/worker/src",
  "packages/contracts/src",
  "packages/domain/src",
  "packages/application/src",
  "packages/runtime-kernel/src",
  "packages/adapters/src",
  "packages/capability/src",
  "packages/intelligence/src",
  "packages/governance/src",
  "packages/environment/src",
  "packages/memory/src",
  "packages/improvement/src",
  "packages/evaluation/src",
  "packages/gateways/src",
  "packages/context/src",
  "packages/evolution/src",
  "packages/testkit/src",
  "examples/field-service/src",
  "packages/py-sdk/src",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["apps", "packages", "tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an async test",
    "integration: mark test as requiring external services",
]
