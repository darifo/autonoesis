name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autonoesis
          POSTGRES_PASSWORD: autonoesis
          POSTGRES_DB: autonoesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autonoesis -d autonoesis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      temporal:
        image: temporalio/auto-setup:1.28.1
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_USER: autonoesis
          POSTGRES_PWD: autonoesis
          POSTGRES_SEEDS: postgres
        ports:
          - 7233:7233
        options: >-
          --health-cmd "tctl --address temporal:7233 namespace describe default > /dev/null 2>&1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: autonoesis
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install workspace
        run: UV_PROJECT_ENVIRONMENT="$CONDA_PREFIX" uv sync --inexact --all-packages --dev --locked
      - name: Prepare evidence directory
        run: mkdir -p .artifacts
      - name: Wait for Temporal component
        run: |
          temporal_ready=false
          for attempt in {1..90}; do
            if python -c "import asyncio; from temporalio.client import Client; asyncio.run(Client.connect('localhost:7233'))" 2>/dev/null; then
              echo "Temporal component ready after ${attempt}s"
              temporal_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$temporal_ready" != true ]]; then
            echo "Temporal component did not become ready within 90s"
            docker logs "${{ job.services.temporal.id }}" 2>&1 | tail -40 || true
            exit 1
          fi
      - name: Initialize PostgreSQL authority roles
        env:
          PGPASSWORD: autonoesis
        run: |
          # GitHub-hosted runners do not ship postgresql-client by default
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -U autonoesis -d autonoesis -v ON_ERROR_STOP=1 -f infra/postgres/ci-users.sql
      - name: Migrate PostgreSQL authority schema
        env:
          AUTONOESIS_MIGRATION_DATABASE_URL: postgresql+psycopg://autonoesis_migrator:autonoesis-ci-only@localhost:5432/autonoesis
          AUTONOESIS_MIGRATION_ROLE: autonoesis_migration
        run: alembic upgrade head
      - name: Start OPA policy component
        run: >-
          docker run --detach --rm --name autonoesis-ci-opa --publish 8181:8181
          --volume "$PWD/infra/policies:/policies:ro"
          openpolicyagent/opa:1.4.2 run --server --addr=0.0.0.0:8181 /policies
      - name: Start MinIO Evidence component
        run: >-
          docker run --detach --rm --name autonoesis-ci-minio --publish 9000:9000
          --env MINIO_ROOT_USER=autonoesis
          --env MINIO_ROOT_PASSWORD=autonoesis-test-only
          --env MINIO_KMS_SECRET_KEY=autonoesis-evidence:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          server /data
      - name: Wait for OPA policy component
        run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8181/health
      - name: Wait for MinIO Evidence component
        run: curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://localhost:9000/minio/health/live
      - name: Production and consumer contract baselines
        run: |
          python3 tools/dev/check_production_baseline.py
          python3 tools/dev/freeze_openapi.py
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Type check
        run: mypy --strict apps packages
      - name: Test
        env:
          AUTONOESIS_TEST_DATABASE_URL: postgresql+psycopg://autonoesis_api:autonoesis-ci-only@localhost:5432/autonoesis
          AUTONOESIS_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://autonoesis:autonoesis@localhost:5432/autonoesis
          AUTONOESIS_TEST_DISPATCH_DATABASE_URL: postgresql+psycopg://autonoesis_outbox:autonoesis-ci-only@localhost:5432/autonoesis
          AUTONOESIS_TEST_BREAKGLASS_DATABASE_URL: postgresql+psycopg://autonoesis_breakglass_login:autonoesis-ci-only@localhost:5432/autonoesis
          AUTONOESIS_TEST_OPA_URL: http://localhost:8181
          AUTONOESIS_TEST_MINIO_URL: http://localhost:9000
          AUTONOESIS_TEST_MINIO_ACCESS_KEY: autonoesis
          AUTONOESIS_TEST_MINIO_SECRET_KEY: autonoesis-test-only
          AUTONOESIS_TEST_TEMPORAL_TARGET: localhost:7233
        run: pytest --junitxml=.artifacts/python-junit.xml
      - name: Build Python evidence manifest
        if: always()
        run: >-
          python tools/dev/build_test_evidence.py
          --output .artifacts/python-evidence.json
          --artifact .artifacts/python-junit.xml
          --artifact docs/roadmap/generated/production-baseline-report.md
          --artifact docs/contracts/generated/openapi-v1.json
      - name: Archive Python and real-component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-component-evidence
          path: .artifacts/
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: autonoesis
          environment-file: environment.yml
          auto-activate-base: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="$CONDA_PREFIX" uv sync --inexact --all-packages --dev --locked
          pnpm install --frozen-lockfile
          mkdir -p .artifacts
      - name: Secret scan
        run: python tools/security/scan_secrets.py
      - name: Python dependency audit
        run: |
          uv export --all-packages --no-dev --no-emit-workspace --frozen --output-file .artifacts/python-requirements.txt
          pip-audit --requirement .artifacts/python-requirements.txt --strict --format json --output .artifacts/pip-audit.json
      - name: Node production dependency audit
        run: >-
          pnpm audit --prod --audit-level high
          --registry=https://registry.npmjs.org --json
          > .artifacts/pnpm-audit.json
      - name: Build security evidence manifest
        if: always()
        run: >-
          python tools/dev/build_test_evidence.py
          --output .artifacts/security-evidence.json
          --artifact .artifacts/python-requirements.txt
          --artifact .artifacts/pip-audit.json
          --artifact .artifacts/pnpm-audit.json
          --artifact .secret-baseline.toml
      - name: Archive security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-secret-scan-evidence
          path: .artifacts/
          retention-days: 30

  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare evidence directory
        run: mkdir -p .artifacts
      - name: Type check
        run: pnpm --filter @autonoesis/cockpit typecheck
      - name: Build
        run: pnpm --filter @autonoesis/cockpit build
      - name: Unit test
        run: >-
          pnpm --filter @autonoesis/cockpit exec vitest run
          --reporter=default --reporter=junit
          --outputFile.junit="$GITHUB_WORKSPACE/.artifacts/cockpit-unit-junit.xml"
      - name: Install Playwright browser
        run: pnpm --filter @autonoesis/cockpit exec playwright install --with-deps chromium
      - name: Browser test
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/.artifacts/cockpit-e2e-junit.xml
        run: pnpm --filter @autonoesis/cockpit exec playwright test --reporter=line,junit
      - name: Build Cockpit evidence manifest
        if: always()
        run: >-
          python3 tools/dev/build_test_evidence.py
          --output .artifacts/cockpit-evidence.json
          --artifact .artifacts/cockpit-unit-junit.xml
          --artifact .artifacts/cockpit-e2e-junit.xml
          --artifact apps/cockpit/dist/index.html
      - name: Archive Cockpit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-test-evidence
          path: .artifacts/
          retention-days: 30
