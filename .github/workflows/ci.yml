name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: autonoesis
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install workspace
        run: UV_PROJECT_ENVIRONMENT="$CONDA_PREFIX" uv sync --inexact --all-packages --dev --locked
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Type check
        run: mypy apps packages --ignore-missing-imports
      - name: Test
        run: pytest

  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter @autonoesis/cockpit typecheck
      - name: Build
        run: pnpm --filter @autonoesis/cockpit build
