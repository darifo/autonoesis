name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autonoesis
          POSTGRES_PASSWORD: autonoesis
          POSTGRES_DB: autonoesis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autonoesis -d autonoesis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: autonoesis
          environment-file: environment.yml
          auto-activate-base: false
      - name: Install workspace
        run: UV_PROJECT_ENVIRONMENT="$CONDA_PREFIX" uv sync --inexact --all-packages --dev --locked
      - name: Initialize PostgreSQL authority roles
        env:
          PGPASSWORD: autonoesis
        run: psql -h localhost -U autonoesis -d autonoesis -v ON_ERROR_STOP=1 -f infra/postgres/ci-users.sql
      - name: Migrate PostgreSQL authority schema
        env:
          AUTONOESIS_MIGRATION_DATABASE_URL: postgresql+psycopg://autonoesis_migrator:autonoesis-ci-only@localhost:5432/autonoesis
          AUTONOESIS_MIGRATION_ROLE: autonoesis_migration
        run: alembic upgrade head
      - name: Start OPA policy component
        run: >-
          docker run --detach --rm --name autonoesis-ci-opa --publish 8181:8181
          --volume "$PWD/infra/policies:/policies:ro"
          openpolicyagent/opa:1.4.2 run --server --addr=0.0.0.0:8181 /policies
      - name: Wait for OPA policy component
        run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8181/health
      - name: Production baseline claims
        run: python3 tools/dev/check_production_baseline.py
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Type check
        run: mypy apps packages --ignore-missing-imports
      - name: Test
        env:
          AUTONOESIS_TEST_DATABASE_URL: postgresql+psycopg://autonoesis_api:autonoesis-ci-only@localhost:5432/autonoesis
          AUTONOESIS_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://autonoesis:autonoesis@localhost:5432/autonoesis
          AUTONOESIS_TEST_OPA_URL: http://localhost:8181
        run: pytest

  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter @autonoesis/cockpit typecheck
      - name: Build
        run: pnpm --filter @autonoesis/cockpit build
      - name: Install Playwright browser
        run: pnpm --filter @autonoesis/cockpit exec playwright install --with-deps chromium
      - name: Browser test
        run: pnpm --filter @autonoesis/cockpit test
