{{- $root := . -}}
{{- $services := list (dict "name" "api" "values" .Values.api) (dict "name" "cockpit" "values" .Values.cockpit) -}}
{{- range $service := $services }}
{{- if $service.values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: autonoesis-{{ $service.name }}
  labels:
    app.kubernetes.io/name: autonoesis
    app.kubernetes.io/component: {{ $service.name }}
spec:
  type: {{ $service.values.service.type }}
  selector:
    app.kubernetes.io/name: autonoesis
    app.kubernetes.io/component: {{ $service.name }}
  ports:
    - name: http
      port: {{ $service.values.service.port }}
      targetPort: http
---
{{- end }}
{{- end }}
