{{- $root := . -}}
{{- $workloads := list
      (dict "name" "api" "cfg" .Values.api "port" .Values.api.service.port "sa" "autonoesis-api" "db" true "env" .Values.api.env)
      (dict "name" "cockpit" "cfg" .Values.cockpit "port" .Values.cockpit.service.port "sa" "autonoesis-cockpit" "db" false "env" dict) -}}
{{- range $pool, $config := .Values.workerPools }}
{{- $workloads = append $workloads (dict
      "name" (printf "worker-%s" $pool)
      "cfg" $config
      "port" nil
      "sa" (printf "autonoesis-worker-%s" $pool)
      "db" true
      "env" (dict "AUTONOESIS_TEMPORAL_TASK_QUEUE" $config.taskQueue "AUTONOESIS_WORKER_RISK_POOL" $config.riskPool)) -}}
{{- end }}
{{- range $workload := $workloads }}
{{- if $workload.cfg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonoesis-{{ $workload.name }}
  labels:
    app.kubernetes.io/name: autonoesis
    app.kubernetes.io/component: {{ $workload.name }}
spec:
  replicas: {{ $workload.cfg.replicas }}
  # Rolling upgrades never drop capacity (P2-01): surge first, then retire.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $root.Values.global.rollingUpdate.maxUnavailable }}
      maxSurge: {{ $root.Values.global.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: autonoesis
      app.kubernetes.io/component: {{ $workload.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonoesis
        app.kubernetes.io/component: {{ $workload.name }}
    spec:
      serviceAccountName: {{ $workload.sa }}
      {{- if $root.Values.global.availabilityZones }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: autonoesis
              app.kubernetes.io/component: {{ $workload.name }}
      {{- end }}
      containers:
        - name: {{ $workload.name }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $workload.cfg.image }}:{{ $workload.cfg.tag }}"
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: {{ $root.Values.podSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop:
{{- range $root.Values.podSecurity.dropCapabilities }}
              - {{ . }}
{{- end }}
          resources:
{{ toYaml $workload.cfg.resources | indent 12 }}
          {{- if $workload.port }}
          ports:
            - name: http
              containerPort: {{ $workload.port }}
          {{- end }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ $root.Values.dependencies.otelCollectorHost }}:{{ $root.Values.dependencies.otelCollectorHttpPort }}"
          {{- range $key, $value := $workload.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- if $workload.db }}
            # Only control-plane and worker duties hold platform credentials;
            # the console runs credential-free behind the ingress.
            - name: AUTONOESIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secretRefs.database }}
                  key: url
            - name: AUTONOESIS_TEMPORAL_TARGET
              value: "{{ $root.Values.dependencies.temporalHost }}:{{ $root.Values.dependencies.temporalPort }}"
          {{- end }}
---
{{- end }}
{{- end }}
