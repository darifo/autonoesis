{{- range $name, $workload := dict "api" .Values.api "worker" .Values.worker "cockpit" .Values.cockpit }}
{{- if $workload.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autonoesis-{{ $name }}
  labels:
    app.kubernetes.io/name: autonoesis
    app.kubernetes.io/component: {{ $name }}
automountServiceAccountToken: false
---
{{- end }}
{{- end }}
