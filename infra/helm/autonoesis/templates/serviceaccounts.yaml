{{- /* Dedicated non-root ServiceAccount per workload and per worker pool
       (P2-01: API, worker pools, Evaluator, and Release Executor never share
       an identity). */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autonoesis-api
  labels:
    app.kubernetes.io/name: autonoesis
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autonoesis-cockpit
  labels:
    app.kubernetes.io/name: autonoesis
automountServiceAccountToken: false
{{- range $pool, $config := .Values.workerPools }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autonoesis-worker-{{ $pool }}
  labels:
    app.kubernetes.io/name: autonoesis
  annotations:
    autonoesis.io/risk-pool: {{ $config.riskPool }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
