{{- if .Values.externalSecrets.enabled }}
{{- $store := .Values.externalSecrets -}}
{{- range $name, $remoteKey := dict
    .Values.secretRefs.database $store.databaseRemoteKey
    .Values.secretRefs.temporal $store.temporalRemoteKey
    .Values.secretRefs.objectStore $store.objectStoreRemoteKey
    .Values.secretRefs.packSigning $store.packSigningRemoteKey }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: autonoesis
spec:
  refreshInterval: {{ $store.refreshInterval }}
  secretStoreRef:
    name: {{ $store.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
  data:
    - secretKey: url
      remoteRef:
        key: {{ $remoteKey }}
        property: url
---
{{- end }}
{{- end }}
