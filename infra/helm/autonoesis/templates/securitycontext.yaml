{{- define "autonoesis.podSecurityContext" -}}
securityContext:
  runAsNonRoot: {{ .Values.podSecurity.runAsNonRoot }}
  runAsUser: {{ .Values.podSecurity.runAsUser }}
  seccompProfile:
    type: {{ .Values.podSecurity.seccompProfile }}
{{- end }}

{{- define "autonoesis.containerSecurityContext" -}}
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: {{ .Values.podSecurity.readOnlyRootFilesystem }}
  capabilities:
    drop:
{{- range .Values.podSecurity.dropCapabilities }}
      - {{ . }}
{{- end }}
{{- end }}
