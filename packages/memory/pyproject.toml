[project]
name = "autonoesis-memory"
version = "0.1.0"
description = "Memory SPI, ledger, write gate, and deletion propagation for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_memory"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
