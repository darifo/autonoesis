[project]
name = "autonoesis-adapters"
version = "0.1.0"
description = "Replaceable infrastructure adapters for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "opentelemetry-api>=1.24",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
  "opentelemetry-sdk>=1.24",
  "autonoesis-application",
  "autonoesis-capability",
  "autonoesis-domain",
  "autonoesis-evolution",
  "autonoesis-runtime-kernel",
  "anthropic>=0.70",
  "alembic>=1.16",
  "boto3>=1.40",
  "httpx>=0.28",
  "jsonschema>=4.25",
  "openai>=2.0",
  "pyjwt[crypto]>=2.10",
  "psycopg[binary]>=3.2",
  "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_adapters"]

[tool.uv.sources]
autonoesis-application = { workspace = true }
autonoesis-capability = { workspace = true }
autonoesis-domain = { workspace = true }
autonoesis-evolution = { workspace = true }
autonoesis-runtime-kernel = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "boto3-stubs[s3]>=1.40",
]
