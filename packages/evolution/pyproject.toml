[project]
name = "autonoesis-evolution"
version = "0.1.0"
description = "Advanced evolution pipeline for Autonoesis: replay, shadow/canary, auto-rollback, AI FinOps, SLO"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_evolution"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
