[project]
name = "autonoesis-context"
version = "0.1.0"
description = "Retrieval, ACL, freshness, conflict, compression, and snapshot for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_context"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
