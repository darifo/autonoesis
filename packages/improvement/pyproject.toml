[project]
name = "autonoesis-improvement"
version = "0.1.0"
description = "Analysis, proposal, candidate, release, and rollback for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_improvement"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
