[project]
name = "autonoesis-sdk"
version = "0.1.0"
description = "Python SDK for Autonoesis Goal and Capability Pack APIs"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_sdk"]
