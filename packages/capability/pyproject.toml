[project]
name = "autonoesis-capability"
version = "0.1.0"
description = "Capability Pack manifest and plugin contracts for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.25",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_capability"]
