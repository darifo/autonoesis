[project]
name = "autonoesis-environment"
version = "0.1.0"
description = "Environment facts, projections, refresh, and simulation for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_environment"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
