[project]
name = "autonoesis-application"
version = "0.1.0"
description = "Application use cases and ports for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-capability",
  "autonoesis-contracts",
  "autonoesis-context",
  "autonoesis-domain",
  "autonoesis-runtime-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_application"]

[tool.uv.sources]
autonoesis-capability = { workspace = true }
autonoesis-contracts = { workspace = true }
autonoesis-context = { workspace = true }
autonoesis-domain = { workspace = true }
autonoesis-runtime-kernel = { workspace = true }
