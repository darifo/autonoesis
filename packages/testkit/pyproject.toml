[project]
name = "autonoesis-testkit"
version = "0.1.0"
description = "Fake providers, attack suites, and contract test support for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
  "autonoesis-contracts",
  "autonoesis-application",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_testkit"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
autonoesis-contracts = { workspace = true }
autonoesis-application = { workspace = true }
