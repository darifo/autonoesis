[project]
name = "autonoesis-evaluation"
version = "0.1.0"
description = "EvaluationCase, Suite, Trial, Harness, and Grader for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_evaluation"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
