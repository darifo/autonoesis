[project]
name = "autonoesis-intelligence"
version = "0.1.0"
description = "Goal clarification, planning, decision, and capability selection for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_intelligence"]

[tool.uv.sources]
autonoesis-domain = { workspace = true }
