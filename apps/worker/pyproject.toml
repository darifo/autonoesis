[project]
name = "autonoesis-worker"
version = "0.1.0"
description = "Autonoesis durable execution worker"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-application",
  "autonoesis-runtime-kernel",
  "temporalio>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoesis_worker"]

[tool.uv.sources]
autonoesis-application = { workspace = true }
autonoesis-runtime-kernel = { workspace = true }
