[project]
name = "autonoesis-example-field-service"
version = "0.1.0"
description = "Field Service Capability Pack example for Autonoesis"
requires-python = ">=3.12"
dependencies = [
  "autonoesis-capability",
  "autonoesis-domain",
  "autonoesis-runtime-kernel",
]

[project.entry-points."autonoesis.capability_packs"]
field-service = "field_service.plugin:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_service"]

[tool.uv.sources]
autonoesis-capability = { workspace = true }
autonoesis-domain = { workspace = true }
autonoesis-runtime-kernel = { workspace = true }
